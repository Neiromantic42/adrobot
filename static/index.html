<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Adrobot: создание кампании</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; }
    #result { margin-top: 20px; white-space: pre-wrap; }
    .ok { color: #137333; } .err { color: #b3261e; }
  </style>
</head>
<body>
  <h2>Создать кампанию</h2>
  <label>Название <input id="name" placeholder="test_tananov_campaign3"></label>
  <label>Гео (2 буквы) <input id="geo" placeholder="PE" maxlength="2"></label>
  <label>ID оффера <input id="offer_id" type="number" placeholder="18813"></label>
  <button id="btn">Создать</button>
  <div id="result"></div>

  <script>
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      result.className = "";
      result.textContent = "Создаю...";
      try {
        const resp = await fetch("/api/campaigns", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value.trim(),
            geo: document.getElementById("geo").value.trim(),
            offer_id: Number(document.getElementById("offer_id").value),
          }),
        });
        const data = await resp.json();
        if (resp.ok) {
          result.className = "ok";
          result.textContent =
            "Готово. Кампания #" + data.campaign.id + " (" + data.campaign.name + ")\n" +
            "Потоки: " + data.streams.map(s => s.name).join(", ");
        } else {
          result.className = "err";
          result.textContent = "Ошибка " + resp.status + ": " + JSON.stringify(data.detail);
        }
      } catch (e) {
        result.className = "err";
        result.textContent = "Сеть: " + e;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
